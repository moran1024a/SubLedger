services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    volumes:
      - ./backend/config/config.toml:/app/config/config.toml:ro
      - subledger-data:/app/data
      - subledger-logs:/app/logs
    networks:
      - 1panel-network

volumes:
  subledger-data:
  subledger-logs:

networks:
  1panel-network:
    external: true
    name: 1panel-network
